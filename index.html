<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="Calendar viewer for an encrypted data file.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="xcal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>xcal</title>
<!-- Paint the background before the stylesheet applies, so a launch from the home screen has no white frame. -->
<style>html{background:#f6f7f9}@media (prefers-color-scheme: dark){html{background:#0f1216}}</style>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1b1f24; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2563eb; --accent-fg: #ffffff; --warn: #b45309; --warn-bg: #fef3c7;
    --err: #b91c1c; --err-bg: #fee2e2; --dim: #9ca3af; --now: #dc2626; --today: #eff6ff;
    --busy: #94a3b8; --free: #86efac;
  }
  :root[data-theme="dark"], :root[data-theme="dark"] body { color-scheme: dark; }
  :root[data-theme="light"], :root[data-theme="light"] body { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --fg: #e6e8eb; --muted: #9aa3ad; --line: #262c34;
      --accent: #60a5fa; --accent-fg: #0b1220; --warn: #fbbf24; --warn-bg: #3b2f0b;
      --err: #f87171; --err-bg: #3b1111; --dim: #5b6570; --now: #f87171; --today: #16202e;
      --busy: #64748b; --free: #166534;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --fg: #e6e8eb; --muted: #9aa3ad; --line: #262c34;
    --accent: #60a5fa; --accent-fg: #0b1220; --warn: #fbbf24; --warn-bg: #3b2f0b;
    --err: #f87171; --err-bg: #3b1111; --dim: #5b6570; --now: #f87171; --today: #16202e;
    --busy: #64748b; --free: #166534;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; background: var(--bg); }
  header { background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .02em; cursor: pointer; }
  header .status { font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button[hidden] { display: none; }
  header .status.stale { color: var(--warn); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.icon { padding: 6px 9px; }
  main { padding: calc(var(--top-h, 100px) + 8px) 16px calc(40px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; overflow-x: hidden; }
  header { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  #btnFull { display: none; }
  body.can-fullscreen #btnFull { display: inline-block; }
  .msg { margin: 16px 0; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .msg.err { background: var(--err-bg); color: var(--err); border-color: transparent; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .msg a { color: inherit; font-weight: 600; }
  form.setup { display: grid; gap: 10px; margin-top: 16px; }
  form.setup label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  form.setup .row { display: flex; gap: 10px; }
  form.setup .row button { flex: 1; padding: 10px; }
  form.setup input, form.setup select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); width: 100%; }
  .day { margin-top: 18px; }
  .weekbar[hidden] { display: none; }
  .weekbar { background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; padding: 6px 16px; padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  .weekbar button { min-width: 44px; min-height: 40px; }
  .weekbar button:disabled { opacity: .35; cursor: default; }
  .weekbar .label { flex: 1; min-width: 0; border: 0; background: none; padding: 2px 4px;
    text-align: center; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weekbar .label .caret { color: var(--muted); font-weight: 400; }
  .weekbar .label small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .weekbar button.now { color: var(--accent); border-color: var(--accent); }
  /* Keeps Today away from the next-week button, which it used to steal taps from. */
  .weekbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 10px; flex: none; }
  .calpop[hidden] { display: none; }
  .calpop { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); width: min(320px, calc(100vw - 32px));
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .calhead b { font-size: 15px; }
  .calhead button { min-width: 44px; }
  .calhead button:disabled { opacity: .35; cursor: default; }
  .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
  .calgrid .wd { font-size: 11px; color: var(--muted); padding: 4px 0; }
  .calgrid button { position: relative; padding: 9px 0; border: 0; background: none; border-radius: 8px; font-size: 14px; }
  .calgrid button.inweek { background: var(--today); }
  .calgrid button.wkend { color: var(--muted); }
  .calgrid button.today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
  .calgrid button.busy::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: var(--accent); }
  .calgrid button:disabled { color: var(--dim); opacity: .5; cursor: default; }
  .calpop .calToday { width: 100%; margin-top: 8px; padding: 8px; }
  .week { border-top: 2px solid var(--line); margin-top: 22px; padding-top: 2px; }
  .week:first-of-type { border-top: 0; margin-top: 0; }
  /* The last week must be able to scroll up under the bar, or next-week cannot reach it. */
  .week:last-of-type { min-height: calc(100vh - var(--top-h, 100px) - 8px); min-height: calc(100dvh - var(--top-h, 100px) - 8px); }
  .day h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 6px; position: sticky; top: var(--top-h, 100px); background: var(--bg); padding: 6px 0; z-index: 1; }
  .day.today h2 { color: var(--accent); }
  .day.weekend h2 { opacity: .8; }
  .empty { color: var(--dim); font-size: 14px; padding: 6px 0; }
  .ev { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 10px 12px; margin-bottom: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .day.today .ev { background: var(--today); }
  .ev.past { opacity: .55; }
  .ev.declined .subj { text-decoration: line-through; }
  .ev > div { min-width: 0; }
  .ev .time { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .ev .time b { display: block; color: var(--fg); font-weight: 600; }
  .ev .subj { font-weight: 600; overflow-wrap: anywhere; }
  .ev .loc { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.tent { border-style: dashed; }
  .badge.oof { color: var(--warn); border-color: var(--warn); }
  .details { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; font-size: 14px; display: none; }
  .ev.open .details { display: block; }
  .details dl { margin: 0 0 8px; display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; overflow-wrap: anywhere; }
  .details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 8px 0 0; color: var(--fg); }
  .details a { color: var(--accent); }
  .join { display: inline-block; margin: 4px 0 8px; padding: 8px 14px; border-radius: 8px;
    background: var(--accent); color: var(--accent-fg) !important; text-decoration: none; font-weight: 600; }
  .nowline { height: 2px; background: var(--now); margin: 2px 0 8px; position: relative; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
  .foot { margin-top: 30px; font-size: 12px; color: var(--dim); text-align: center; }
  .spinner { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
  /* Outline view: one bar per day from the first booking to the last, gaps in between. */
  .obar[hidden] { display: none; }
  .obar { background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 16px; padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); font-size: 13px; }
  .obar .lbl { color: var(--muted); }
  .obar .sp { flex: 1; }
  .obar button { padding: 4px 8px; min-width: 36px; }
  .obar button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .owk { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  .owk small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  .orow { display: grid; grid-template-columns: 58px 90px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; cursor: pointer; }
  .orow.scale { cursor: default; padding: 0; }
  .orow .od { color: var(--muted); white-space: nowrap; }
  .orow.today .od { color: var(--accent); font-weight: 600; }
  .orow .ot { font-variant-numeric: tabular-nums; }
  .orow .ot.none { color: var(--dim); }
  .orow .ot.oof { color: var(--warn); }
  .ticks { position: relative; height: 14px; font-size: 11px; color: var(--muted); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
  .tl { position: relative; height: 22px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    background-color: var(--card); background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); }
  .tl i { position: absolute; top: 0; bottom: 0; }
  .tl .b { background: var(--busy); }
  .tl .b.tent { background: repeating-linear-gradient(135deg, var(--busy) 0 3px, transparent 3px 6px); }
  .tl .g { background: var(--free); }
  .tl .nw { width: 2px; margin-left: -1px; background: var(--now); }
  .slots { margin: 10px 0 4px; font-size: 14px; }
  .slots h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .slot { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; padding: 6px 10px; margin-bottom: 4px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--free); border-radius: 8px; font-variant-numeric: tabular-nums; }
  .slot .od { color: var(--muted); white-space: nowrap; }
  .slot .len { color: var(--muted); }
  .slots .none { color: var(--dim); }
</style>
</head>
<body>
<div id="top">
<header>
  <h1>xcal</h1>
  <span id="status" class="status"></span>
  <button id="btnRefresh" class="icon" title="Refresh" aria-label="Refresh">&#x21bb;</button>
  <button id="btnView" class="icon" hidden></button>
  <button id="btnFull" class="icon" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
  <button id="btnSettings" class="icon" title="Settings" aria-label="Settings">&#x2699;</button>
</header>
<div class="weekbar" id="weekbar" hidden>
  <button id="btnPrev" aria-label="Previous week">&#x2039;</button>
  <button id="weekLabel" class="label" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="calpop"></button>
  <button id="btnNext" aria-label="Next week">&#x203a;</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btnNow" class="now">Today</button>
</div>
<div class="obar" id="outlinebar" hidden>
  <span class="lbl">Free &#x2265;</span>
  <button type="button" data-slot="30">30</button>
  <button type="button" data-slot="60">60</button>
  <button type="button" data-slot="90">90</button>
  <button type="button" data-slot="120">120</button>
  <span class="sp"></span>
  <button type="button" id="btnTent" title="Whether tentative meetings block a slot"></button>
</div>
<div id="calpop" class="calpop" role="dialog" aria-label="Go to date" hidden></div>
</div>
<main id="main"></main>
<script>
(function () {
  'use strict';
  var LS = { src: 'xcal.src', pass: 'xcal.pass', blob: 'xcal.blob', fetched: 'xcal.fetched', theme: 'xcal.theme',
             view: 'xcal.view', slot: 'xcal.slot', tent: 'xcal.tent' };
  var STALE_HOURS = 3, FETCH_TIMEOUT = 12000;
  var main = document.getElementById('main');
  var weekbar = document.getElementById('weekbar'), weekLabel = document.getElementById('weekLabel');
  var btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
  var calpop = document.getElementById('calpop'), calMonth = null;
  var statusEl = document.getElementById('status');
  var btnView = document.getElementById('btnView'), outlinebar = document.getElementById('outlinebar');
  var state = { src: null, pass: null, data: null, offline: false, fetchErr: null, fetching: false, open: {} };
  // View choices are preferences, like the theme: they survive "forget".
  var prefs = { view: ls(LS.view) === 'outline' ? 'outline' : 'list', slot: Number(ls(LS.slot)) || 90, tentFree: ls(LS.tent) === 'free' };
  var keyCache = { salt: null, iter: 0, key: null };

  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
    catch (e) { return null; }
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function linkify(s) {
    return esc(s).replace(/https?:\/\/[^\s<>"']+/g, function (u) {
      var t = u.replace(/[.,;:)\]]+$/, ''); var tail = u.slice(t.length);
      return '<a href="' + t + '" target="_blank" rel="noopener">' + t + '</a>' + tail; });
  }
  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function dayKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function fmtTime(d) { return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function fmtDay(d) { return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }); }
  function fmtDayShort(d) { return d.toLocaleDateString([], { weekday: 'short', day: 'numeric' }); }
  function fmtDayLong(d) { return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
    return y + '-W' + ('0' + w).slice(-2);
  }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtRange(a, b) {
    var sameMonth = a.getMonth() === b.getMonth();
    var left = a.toLocaleDateString([], sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' });
    return left + ' – ' + b.toLocaleDateString([], { day: 'numeric', month: 'short' });
  }
  function ago(d) {
    var m = Math.round((Date.now() - d) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  }

  // ---------------------------------------------------------------- views
  function applyTheme() {
    var t = ls(LS.theme);
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  function show(html) { main.innerHTML = html; }
  function setStatus(text, stale) { statusEl.textContent = text || ''; statusEl.className = 'status' + (stale ? ' stale' : ''); }
  function bind(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

  function showSetup(message) {
    setStatus(''); closeCal(); weekbar.hidden = outlinebar.hidden = btnView.hidden = true; layoutTop();
    show(
      (message ? '<div class="msg err">' + esc(message) + '</div>' : '') +
      '<form class="setup" id="setup">' +
      '<label>Data URL<input name="src" type="url" required autocomplete="off" spellcheck="false" value="' + esc(state.src || '') + '" placeholder="https://…/cal.enc"></label>' +
      '<label>Passphrase<input name="pass" type="password"' + (state.pass ? ' placeholder="(unchanged)"' : ' required') + ' autocomplete="current-password"></label>' +
      '<label>Appearance<select name="theme">' + ['system', 'light', 'dark'].map(function (t) {
        return '<option value="' + t + '"' + ((ls(LS.theme) || 'system') === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
      '<div class="row"><button class="primary" type="submit">' + (state.data ? 'Save' : 'Open') + '</button>' +
      (state.data ? '<button type="button" id="btnCancel">Cancel</button>' : '') + '</div>' +
      (ls(LS.blob) || state.src ? '<button type="button" id="btnForget">Forget everything on this device</button>' : '') +
      '</form>');
    var form = document.getElementById('setup');
    // The theme applies as soon as it is picked; the form only persists the rest.
    form.theme.addEventListener('change', function () {
      ls(LS.theme, form.theme.value === 'system' ? null : form.theme.value); applyTheme();
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var src = form.src.value.trim(), pass = form.pass.value || state.pass;
      var changed = src !== state.src || pass !== state.pass;
      state.src = src; state.pass = pass;
      ls(LS.src, state.src); ls(LS.pass, state.pass);
      if (changed) { keyCache.key = null; state.data = null; ls(LS.blob, null); idb('clear'); load({ scroll: true }); }
      else if (state.data) render(true);
      else load({ scroll: true });
    });
    bind('btnCancel', function () { render(true); });
    bind('btnForget', forget);
  }
  function forget() {
    ls(LS.src, null); ls(LS.pass, null); ls(LS.blob, null); ls(LS.fetched, null);
    idb('clear');
    state = { src: null, pass: null, data: null, offline: false, fetchErr: null, fetching: false, open: {} };
    keyCache = { salt: null, iter: 0, key: null };
    showSetup();
  }

  // ---------------------------------------------------------------- crypto
  // The derived key is kept in IndexedDB (a CryptoKey is storable, and stays
  // non-extractable), so a launch on a slow phone skips the PBKDF2 work as long
  // as the data file keeps using the same salt.
  function idb(op, value) {
    return new Promise(function (resolve) {
      if (!window.indexedDB) return resolve(null);
      var req; try { req = indexedDB.open('xcal', 1); } catch (e) { return resolve(null); }
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onerror = function () { resolve(null); };
      req.onsuccess = function () {
        var db = req.result, tx, st, r;
        try {
          tx = db.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'); st = tx.objectStore('kv');
          if (op === 'get') r = st.get('key'); else if (op === 'put') r = st.put(value, 'key'); else r = st.clear();
          r.onsuccess = function () { resolve(r.result || null); db.close(); };
          r.onerror = function () { resolve(null); db.close(); };
        } catch (e) { resolve(null); }
      };
    });
  }
  function deriveKey(blob, pass) {
    var sub = window.crypto && window.crypto.subtle;
    if (!sub) return Promise.reject(new Error('WebCrypto is not available in this browser (needs HTTPS)'));
    if (keyCache.key && keyCache.salt === blob.salt && keyCache.iter === blob.iter) return Promise.resolve(keyCache.key);
    return idb('get').then(function (saved) {
      if (saved && saved.salt === blob.salt && saved.iter === blob.iter && saved.key) return saved.key;
      return sub.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return sub.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); });
    }).then(function (key) {

      var wd = new Date(d); wd.setDate(d.getDate() + i);
      html += '<span class="wd">' + esc(wd.toLocaleDateString([], { weekday: 'narrow' })) + '</span>';
    }
    do {
      for (i = 0; i < 7; i++, d.setDate(d.getDate() + 1)) {
        if (d.getMonth() !== mo) { html += '<span></span>'; continue; }
        var k = dayKey(d), cls = [];
        if (k === todayKey) cls.push('today');
        if (c.busy[k]) cls.push('busy');
        if ('w-' + isoWeek(d) === shown) cls.push('inweek');
        if (d.getDay() === 0 || d.getDay() === 6) cls.push('wkend');
        html += '<button type="button" data-day="' + k + '" class="' + cls.join(' ') + '"' +
          (k < c.from || k > c.to ? ' disabled' : '') + ' aria-label="' + esc(fmtDayLong(d)) + '">' + d.getDate() + '</button>';
      }
    } while (d.getMonth() === mo);
    html += '</div><button type="button" class="primary calToday">Today</button>';
    calpop.innerHTML = html;
  }

  function eventHtml(ev, kind, dayK, now) {
    var past = ev._e <= now;
    var cls = 'ev' + (past ? ' past' : '') + (ev.responseStatus === 'declined' || ev.isCancelled ? ' declined' : '') + (state.open[ev._id] ? ' open' : '');
    var time;
    if (kind === 'allday') {
      var days = Math.round((ev._e - ev._s) / 864e5);
      time = '<b>all day</b>' + (days > 1 ? days + ' days' : '');
    } else {
      var sameDay = dayKey(ev._e) === dayK || (ev._e - ev._s) < 864e5 && dayKey(new Date(ev._e - 1)) === dayK;
      time = '<b>' + esc(fmtTime(ev._s)) + '</b>' + (sameDay ? esc(fmtTime(ev._e)) : '→ ' + esc(fmtDay(ev._e)) + ' ' + esc(fmtTime(ev._e)));
    }
    var badges = '';
    if (ev.responseStatus === 'tentative' || ev.busyStatus === 'tentative') badges += '<span class="badge tent">tentative</span>';
    if (ev.busyStatus === 'oof') badges += '<span class="badge oof">out of office</span>';
    if (ev.busyStatus === 'free') badges += '<span class="badge">free</span>';
    if (ev.isPrivate) badges += '<span class="badge">private</span>';
    if (ev.isCancelled) badges += '<span class="badge oof">cancelled</span>';
    if (ev.isRecurring) badges += '<span class="badge" title="recurring">&#x21bb;</span>';
    if (badges) badges = '<span class="badges">' + badges + '</span>';

    var req = ev.required || [], opt = ev.optional || [], cats = ev.categories || [];
    var det = '';
    if (ev.meetingUrl) det += '<a class="join" href="' + esc(ev.meetingUrl) + '" target="_blank" rel="noopener">Join meeting</a>';
    det += '<dl>';
    if (ev.location) det += '<dt>Where</dt><dd>' + linkify(ev.location) + '</dd>';
    if (ev.organizer) det += '<dt>Organizer</dt><dd>' + esc(ev.organizer) + '</dd>';
    if (req.length) det += '<dt>Required</dt><dd>' + esc(req.join(', ')) + '</dd>';
    if (opt.length) det += '<dt>Optional</dt><dd>' + esc(opt.join(', ')) + '</dd>';
    if (ev.responseStatus && ev.responseStatus !== 'none') det += '<dt>Response</dt><dd>' + esc(ev.responseStatus) + '</dd>';
    if (cats.length) det += '<dt>Categories</dt><dd>' + esc(cats.join(', ')) + '</dd>';
    det += '</dl>';
    if (ev.body && ev.body.trim()) det += '<pre>' + linkify(ev.body.trim()) + '</pre>';

    return '<div class="' + cls + '" data-id="' + esc(ev._id) + '">' +
      '<div class="time">' + time + '</div>' +
      '<div><div class="subj">' + esc(ev.subject || '(no subject)') + badges + '</div>' +
      (ev.location ? '<div class="loc">' + esc(ev.location) + '</div>' : '') + '</div>' +
      '<div class="details">' + det + '</div></div>';
  }

  // ---------------------------------------------------------------- boot
  main.addEventListener('click', function (e) {
    var go = e.target.closest ? e.target.closest('[data-goto]') : null;
    if (go) { userNav(); setView('list', go.getAttribute('data-goto')); return; }
    var card = e.target.closest ? e.target.closest('.ev') : null;
    if (!card || e.target.tagName === 'A') return;
    var id = card.getAttribute('data-id');
    if (state.open[id]) delete state.open[id]; else state.open[id] = true;
    card.classList.toggle('open');
  });
  document.getElementById('btnRefresh').addEventListener('click', function () { load({ scroll: true }); });
  document.getElementById('btnSettings').addEventListener('click', function () {
    if (document.getElementById('setup') && state.data) render(true); else showSetup();
  });
  // When the user last moved around; a background fetch only jumps to today
  // when it started after that.
  var navAt = 0;
  function userNav() { navAt = Date.now(); }
  function navTo(fn) { return function () { userNav(); closeCal(); fn(); }; }
  document.querySelector('header h1').addEventListener('click', navTo(scrollToday));
  btnPrev.addEventListener('click', navTo(function () { stepWeek(-1); }));
  btnNext.addEventListener('click', navTo(function () { stepWeek(1); }));
  document.getElementById('btnNow').addEventListener('click', navTo(scrollToday));
  btnView.addEventListener('click', function () {
    if (!state.data) return;
    userNav(); setView(prefs.view === 'outline' ? 'list' : 'outline');
  });
  outlinebar.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !state.data) return;
    if (b.hasAttribute('data-slot')) { prefs.slot = Number(b.getAttribute('data-slot')); ls(LS.slot, String(prefs.slot)); }
    else if (b.id === 'btnTent') { prefs.tentFree = !prefs.tentFree; ls(LS.tent, prefs.tentFree ? 'free' : null); }
    else return;
    render(false);
  });
  window.addEventListener('wheel', userNav, { passive: true });
  window.addEventListener('touchmove', userNav, { passive: true });
  weekLabel.addEventListener('click', function (e) {
    e.stopPropagation();
    if (calpop.hidden) openCal(); else closeCal();
  });
  // Stop clicks here from reaching the document's outside-click handler: a
  // month change replaces the clicked button, which then looks like an outside click.
  calpop.addEventListener('click', function (e) {
    e.stopPropagation();
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.disabled) return;
    if (b.hasAttribute('data-month')) { calMonth.setMonth(calMonth.getMonth() + Number(b.getAttribute('data-month'))); renderCal(); return; }
    var key = b.getAttribute('data-day');
    navTo(key ? function () { scrollToDay(key); } : scrollToday)();
  });
  document.addEventListener('click', closeCal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCal(); });
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    (window.requestAnimationFrame || setTimeout)(function () { ticking = false; if (state.data) updateWeekbar(); });
  }, { passive: true });
  applyTheme(); layoutTop();
  window.addEventListener('resize', layoutTop);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.data) { render(false); load({ scroll: true }); }
  });
  window.addEventListener('online', function () { if (state.data) load({ scroll: false }); });
  window.addEventListener('offline', function () { if (state.data) { state.offline = true; render(false); } });
  // Keep "past" dimming and the now-line honest while the page stays open.
  setInterval(function () { if (state.data && !document.hidden) render(false); }, 60000);

  // Fullscreen for a browser tab. An installed app is already full screen, and
  // iOS has no fullscreen for pages, so the button only appears where it helps.
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var root = document.documentElement;
  if (!standalone && root.requestFullscreen && document.fullscreenEnabled) {
    document.body.classList.add('can-fullscreen');
    document.getElementById('btnFull').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else root.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
    });
    document.addEventListener('fullscreenchange', function () {
      document.getElementById('btnFull').innerHTML = document.fullscreenElement ? '&#x2716;' : '&#x26F6;';
    });
  }

  // The service worker makes the page installable on Android (Firefox and
  // Chrome hand out a bookmark without one) and serves the shell from cache
  // first, refreshing it in the background, so a launch never waits on the
  // network. A new version is therefore seen on the launch after the one that
  // fetched it.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      var check = function () { reg.update().catch(function () {}); };
      setInterval(check, 60 * 60 * 1000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    }).catch(function (e) { if (window.console) console.debug('Service worker not registered:', e); });
  }

  var m = /[#&]src=([^&]+)/.exec(location.hash), mp = /[#&]pass=([^&]+)/.exec(location.hash);
  if (m) { state.src = decodeURIComponent(m[1]); ls(LS.src, state.src); } else state.src = ls(LS.src);
  if (mp) { state.pass = decodeURIComponent(mp[1]); ls(LS.pass, state.pass); } else state.pass = ls(LS.pass);
  if (m || mp) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (m || mp) { ls(LS.blob, null); idb('clear'); }
  load({ scroll: true });
})();
</script>
